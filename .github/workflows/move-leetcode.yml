name: Move LeetCode Solutions

on:
  push:
    branches:
      - main

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Move files to target folder
        run: |
          TARGET_DIR="LeetCode"
          mkdir -p "$TARGET_DIR"

          for item in [0-9]*; do
            if [ -e "$item" ]; then
              # 일반 mv 대신 git mv를 사용하여 파일이 '이동'했음을 Git에 명확히 알림
              git mv "$item" "$TARGET_DIR/"
            fi
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # . 대신 -A를 사용하여 이동(삭제 후 생성)된 모든 변경사항을 확실히 스테이징
          git add -A
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-move LeetCode solutions to $TARGET_DIR"
            git push
          fi
