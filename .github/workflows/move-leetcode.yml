name: Move LeetCode Solutions

on:
  push:
    branches:
      - main

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Move files to target folder
        run: |
          TARGET_DIR="LeetCode"
          mkdir -p "$TARGET_DIR"

          for item in [0-9]*; do
            if [ -d "$item" ]; then
              # 1. LeetCode 폴더 안에 동일한 문제 폴더 생성 (이미 있으면 패스)
              mkdir -p "$TARGET_DIR/$item"
              
              # 2. 내용물을 통째로 복사 (기존 코드가 있다면 덮어쓰기)
              cp -r "$item"/* "$TARGET_DIR/$item/"
              
              # 3. 루트에 남은 원본 폴더 강제 삭제
              rm -rf "$item"
            fi
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-move LeetCode solutions to $TARGET_DIR"
            git push
          fi
