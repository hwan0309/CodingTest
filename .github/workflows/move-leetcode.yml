name: Move LeetCode Solutions

on:
  push:
    branches:
      - main # 레포지토리의 기본 브랜치가 master라면 master로 변경하세요.

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 봇이 파일을 이동하고 커밋할 수 있는 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Move files to target folder
        run: |
          # 1. 이동시킬 최종 폴더명 설정
          TARGET_DIR="LeetCode"
          
          # 2. 대상 폴더 생성
          mkdir -p "$TARGET_DIR"

          # 3. 숫자로 시작하는 폴더/파일만 찾아서 이동 (백준, 프로그래머스 폴더 보호)
          for item in [0-9]*; do
            if [ -e "$item" ]; then
              mv "$item" "$TARGET_DIR/"
            fi
          done

      - name: Commit and Push changes
        run: |
          # 5. 깃허브 봇 계정으로 설정
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # 6. 변경사항(이동된 파일)이 있을 때만 커밋 후 푸시
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-move LeetCode solutions to $TARGET_DIR"
            git push
          fi
